[project]
name = "joint-grpo-fragility-gaia"
version = "0.1.0"
description = "Joint inference across DART (2602.00994) and TPO (2604.06159): do GRPO-based agent RL methods have systemic weaknesses?"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "2602-00994-gaia",
  "2604-06159-gaia",
  "2604-23747-gaia",
]

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/joint_grpo_fragility"]

[tool.gaia]
type = "knowledge-package"
uuid = "abcdef01-2345-6789-abcd-ef0123456789"
